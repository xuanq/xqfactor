[project]
name = "xqfactor"
version = "0.2.0"
description = "数据源无关的 Pandas 因子表达式、执行缓存和检验规范框架"
readme = "README.md"
authors = [
    { name = "xuanqi", email = "xuanqiraphael@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
analysis = [
    "scipy>=1.14",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "scipy>=1.14",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
